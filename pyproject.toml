[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-eye-match"
version = "0.1.0"
description = "Two-pass color and exposure matching for synchronized stereo, VR and 360-degree video."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sergejzr" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8"
]
keywords = ["vr", "stereo-video", "3d-video", "360-video", "equirectangular", "opencv", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Image Processing"
]

[project.scripts]
stereo-eye-match = "stereo_eye_match.cli:main"

[tool.setuptools.packages.find]
include = ["stereo_eye_match*"]
